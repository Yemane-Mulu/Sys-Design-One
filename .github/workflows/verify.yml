# KNOXNET-FIXES Req 11 verification workflow. Runs the complete existing
# test suite once (non-watch), the Type_Check, and the Production_Build on
# GitHub-hosted runners. No dev/preview/watch servers, no secrets.
name: verify

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (from lockfile only)
        run: npm ci
      - name: Existing test suite (vitest run, non-watch)
        run: npm test
      - name: Type check (tsc -b)
        run: npx tsc -b
      - name: Production build (vite build)
        run: npm run build
